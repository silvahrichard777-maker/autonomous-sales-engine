name: Teste Telegram
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail-with-body -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Teste do Radar de Ofertas BR"
