name: Teste Telegram
on: workflow_dispatch
jobs:
  teste:
    runs-on: ubuntu-24.04
    steps:
      - name: Enviar mensagem de teste
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Tamanho do token: ${#TOKEN}"
          echo "Chat usado: $CHAT"
          RESPOSTA=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" \
            -d text="✅ Teste do Radar de Ofertas BR")
          echo "Resposta do Telegram: $RESPOSTA"

