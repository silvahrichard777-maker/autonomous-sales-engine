name: Publicar ofertas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar ofertas no canal
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request

          token = os.environ.get("TOKEN", "").strip()
          chat = os.environ.get("CHAT", "").strip()
          if not token or not chat:
              print("Erro: faltam os secrets TELEGRAM_BOT_TOKEN ou TELEGRAM_CHAT_ID")
              sys.exit(1)

          lojas = {"shopee": "Shopee", "mercadolivre": "Mercado Livre", "amazon": "Amazon"}

          with open("products.json", encoding="utf-8") as f:
              dados = json.load(f)

          enviadas = 0
          for p in dados["products"]:
              if p.get("status") != "published":
                  continue
              linhas = ["🔥 " + p["name"]]
              if p.get("price") is not None:
                  linhas.append("💰 R$ " + f"{p['price']:.2f}".replace(".", ","))
              linhas.append("🛒 " + lojas.get(p["platform"], p["platform"]))
              linhas.append("👉 " + p["affiliate_link"])
              texto = "\n".join(linhas)

              url = "https://api.telegram.org/bot" + token + "/sendMessage"
              corpo = urllib.parse.urlencode({"chat_id": chat, "text": texto}).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, data=corpo), timeout=30) as r:
                      resposta = json.load(r)
              except urllib.error.HTTPError as e:
                  try:
                      resposta = json.load(e)
                  except Exception:
                      resposta = {"ok": False, "description": "HTTP " + str(e.code)}
              except Exception as e:
                  resposta = {"ok": False, "description": type(e).__name__}

              if resposta.get("ok"):
                  p["status"] = "posted"
                  enviadas += 1
                  with open("products.json", "w", encoding="utf-8") as f:
                      json.dump(dados, f, ensure_ascii=False, indent=2)
                      f.write("\n")
                  print("Enviada:", p["name"])
                  time.sleep(3)
              else:
                  print("Erro ao enviar:", p["name"], "-", resposta.get("description"))
                  sys.exit(1)

          print("Ofertas enviadas:", enviadas)
          PY

      - name: Salvar o que foi publicado
        if: always()
        run: |
          git config user.name "robo"
          git config user.email "robo@users.noreply.github.com"
          git add products.json
          git diff --staged --quiet || (git commit -m "Ofertas publicadas" && git push)
