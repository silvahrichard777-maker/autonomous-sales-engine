
name: Publicar ofertas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11-23/2 * * *"

permissions:
  contents: write

concurrency:
  group: publicar-ofertas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Publicar um produto no Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ.get("TOKEN", "").strip()
          chat = os.environ.get("CHAT", "").strip()

          if not token or not chat:
              print("Erro: configure os Secrets do Telegram.")
              sys.exit(1)

          with open("products.json", encoding="utf-8") as f:
              dados = json.load(f)

          produto = None

          for p in dados["products"]:
              if p.get("status") == "pending":
                  produto = p
                  break

          if produto is None:
              print("Nenhum produto pendente.")
              sys.exit(0)

          nome = produto["name"]
          link = produto.get("affiliate_link", "")

          if not link:
              print("Erro: produto sem link de afiliado:", nome)
              sys.exit(1)

          linhas = ["🔥😱 " + nome, ""]

          if produto.get("price") is not None:
              preco = float(produto["price"])
              linhas.append("💰 R$ " + f"{preco:.2f}".replace(".", ","))

          if produto.get("commission") is not None:
              linhas.append("💸 Comissão: R$ " + str(produto["commission"]))

          if produto.get("coupon"):
              linhas.append("🎟️ Cupom: " + produto["coupon"])

          linhas += [
              "",
              "⚠️ Preço e estoque sujeitos a alteração."
          ]

          texto = "\n".join(linhas)

          teclado = {
              "inline_keyboard": [[
                  {
                      "text": "🛒 VER OFERTA",
                      "url": link
                  }
              ]]
          }

          if produto.get("image"):
              metodo = "sendPhoto"
              campos = {
                  "chat_id": chat,
                  "photo": produto["image"],
                  "caption": texto,
                  "reply_markup": json.dumps(teclado)
              }
          else:
              metodo = "sendMessage"
              campos = {
                  "chat_id": chat,
                  "text": texto,
                  "reply_markup": json.dumps(teclado)
              }

          url = "https://api.telegram.org/bot" + token + "/" + metodo

          corpo = urllib.parse.urlencode(campos).encode()

          requisicao = urllib.request.Request(url, data=corpo)

          try:
              with urllib.request.urlopen(requisicao, timeout=30) as resposta:
                  resultado = json.loads(resposta.read())
          except Exception as erro:
              print("Erro ao enviar:", erro)
              sys.exit(1)

          if not resultado.get("ok"):
              print("Erro Telegram:", resultado)
              sys.exit(1)

          produto["status"] = "published"
          produto["published_at"] = datetime.now(
              timezone.utc
          ).isoformat()

          with open("products.json", "w", encoding="utf-8") as f:
              json.dump(dados, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Produto publicado:", nome)
          print("Ofertas enviadas: 1")
          PY

      - name: Salvar o que foi publicado
        run: |
          git config user.name "robo"
          git config user.email "robo@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet || (
            git commit -m "Oferta publicada" &&
            git push
          )
