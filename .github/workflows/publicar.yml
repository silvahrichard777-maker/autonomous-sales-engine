name: Publicar ofertas

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar ofertas no canal
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -eo pipefail
          n=$(jq '.products | length' products.json)
          enviadas=0
          for i in $(seq 0 $((n-1))); do
            status=$(jq -r --argjson i "$i" '.products[$i].status' products.json)
            if [ "$status" != "published" ]; then continue; fi
            texto=$(jq -r --argjson i "$i" '.products[$i] |
              ({"shopee":"Shopee","mercadolivre":"Mercado Livre","amazon":"Amazon"}[.platform] // .platform) as $loja |
              "🔥 " + .name + "\n" +
              (if .price then
                ((.price * 100 | round) as $c |
                 "💰 R$ " + (($c / 100 | floor) | tostring) + "," + (($c % 100) | tostring | if length < 2 then "0" + . else . end) + "\n")
              else "" end) +
              "🛒 " + $loja + "\n" +
              "👉 " + .affiliate_link' products.json)
            resposta=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT}" \
              --data-urlencode "text=${texto}")
            if echo "$resposta" | jq -e '.ok == true' > /dev/null; then
              jq --argjson i "$i" '.products[$i].status = "posted"' products.json > tmp.json
              mv tmp.json products.json
              enviadas=$((enviadas+1))
            else
              echo "Erro ao enviar: $(echo "$resposta" | jq -r '.description')"
              exit 1
            fi
            sleep 3
          done
          echo "Ofertas enviadas: $enviadas"

      - name: Salvar o que foi publicado
        if: always()
        run: |
          git config user.name "robo"
          git config user.email "robo@users.noreply.github.com"
          git add products.json
          git diff --staged --quiet || (git commit -m "Ofertas publicadas" && git push)


