name: publicar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Publicar um produto no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          import urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat = os.environ["TELEGRAM_CHAT_ID"].strip()

          with open("products.json", encoding="utf-8") as f:
              dados = json.load(f)

          lista = dados if isinstance(dados, list) else dados.get("products", [])

          produto = None
          for p in lista:
              if p.get("status") == "published":
                  produto = p
                  break

          if produto is None:
              print("Nenhum produto na fila (status published)")
              sys.exit(0)

          nome = produto.get("name", "Oferta")
          preco = produto.get("price")
          cupom = produto.get("coupon")
          link = produto.get("affiliate_link", "")
          loja = produto.get("platform", "")

          if not link:
              print("Produto sem affiliate_link:", nome)
              sys.exit(1)

          if isinstance(preco, (int, float)):
              preco = "R$ " + f"{preco:.2f}".replace(".", ",")

          linhas = ["🔥 " + nome, ""]
          if preco:
              linhas.append("💰 Por " + str(preco))
          if cupom:
              linhas.append("🎟️ Cupom: " + str(cupom))
          if loja:
              linhas.append("🛒 " + str(loja))
          linhas += ["", "👉 " + link, ""]
          linhas.append("⚠️ Preço e estoque sujeitos a alteração.")
          linhas.append("📢 Anúncio")
          texto = "\n".join(linhas)

          teclado = {
              "inline_keyboard": [[
                  {"text": "🛒 Ver oferta", "url": link}
              ]]
          }

          if produto.get("image"):
              metodo = "sendPhoto"
              campos = {
                  "chat_id": chat,
                  "photo": produto["image"],
                  "caption": texto,
                  "reply_markup": json.dumps(teclado)
              }
          else:
              metodo = "sendMessage"
              campos = {
                  "chat_id": chat,
                  "text": texto,
                  "reply_markup": json.dumps(teclado)
              }

          url = "https://api.telegram.org/bot" + token + "/" + metodo
          corpo = urllib.parse.urlencode(campos).encode()
          requisicao = urllib.request.Request(url, data=corpo)

          try:
              with urllib.request.urlopen(requisicao, timeout=30) as resposta:
                  resultado = json.loads(resposta.read())
          except urllib.error.HTTPError as erro:
              print("Erro Telegram:", erro.read().decode())
              sys.exit(1)
          except Exception as erro:
              print("Erro ao enviar:", erro)
              sys.exit(1)

          if not resultado.get("ok"):
              print("Erro Telegram:", resultado)
              sys.exit(1)

          produto["status"] = "posted"
          produto["published_at"] = datetime.now(timezone.utc).isoformat()

          with open("products.json", "w", encoding="utf-8") as f:
              json.dump(dados, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("Produto publicado:", nome)
          PY

      - name: Salvar o que foi publicado
        run: |
          git config user.name "robo"
          git config user.email "robo@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet || (
            git commit -m "Oferta publicada" &&
            git push
          )
