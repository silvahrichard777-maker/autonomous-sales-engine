name: agendar

on:
  schedule:
    - cron: "0 12,15,18,22 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml --repo ${{ github.repository }}
