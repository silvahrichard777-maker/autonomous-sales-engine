
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autonomous Sales Engine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 24px;
    }
    h1 { color: #60a5fa; }
    .card {
      background: #1e293b;
      padding: 18px;
      margin: 14px 0;
      border-radius: 12px;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
    }
    .status { color: #fbbf24; }
  </style>
</head>
<body>
  <h1>Autonomous Sales Engine</h1>
  <p>Painel de controle de vendas</p>

  <div class="card">
    <h2>Catálogo de produtos</h2>
    <p id="status">Carregando produtos...</p>
    <div id="products"></div>
    <button onclick="loadProducts()">Atualizar catálogo</button>
  </div>

  <div class="card">
    <h2>Automação</h2>
    <p class="status">Modo de demonstração</p>
    <p>As integrações com as plataformas ainda não foram configuradas.</p>
  </div>

  <script>
    async function loadProducts() {
      const status = document.getElementById("status");
      const list = document.getElementById("products");

      try {
        const response = await fetch("./products.json");
        if (!response.ok) throw new Error("Arquivo não encontrado");

        const data = await response.json();
        list.replaceChildren();

        data.products.forEach(product => {
          const card = document.createElement("div");
          card.className = "card";

          const name = document.createElement("h3");
          name.textContent = product.name;

          const details = document.createElement("p");
          details.textContent =
            "Plataforma: " + product.platform +
            " | Status: " + product.status;

          card.append(name, details);
          list.appendChild(card);
        });

        status.textContent =
          data.products.length + " produto(s) encontrado(s).";
      } catch (error) {
        status.textContent =
          "Catálogo indisponível. Verifique a publicação do painel.";
      }
    }

    loadProducts();
  </script>
</body>
</html>
